# 方胜纹 LoRA v2 训练配置
# v1 教训：密铺交织、开窗感不足、线条杂乱
# v2：统一 caption 模板 + 开窗/边框 44% 训练占比 + 更稳学习率 + 12 epoch 每轮出图检查
# 数据：27源图 -> 54张训练图
#   2_fangsheng_border/  开窗边框型 11源图×flip=22张, repeats=2 (核心, 训练占比44%)
#   2_fangsheng_tile/    规整菱形连续/对称 12源图×flip=24张, repeats=2
#   1_fangsheng_single/  其他补充 4源图×flip=8张, repeats=1
# 步数：44 + 48 + 8 = 100步/epoch × 12 epoch = 1200步
# 触发词：ichpattern_fangsheng

# === 基础模型 ===
pretrained_model_name_or_path = "C:/LoraTraining/stable-diffusion-webui/models/Stable-diffusion/v1-5-pruned-emaonly.safetensors"
tokenizer_cache_dir = "C:/LoraTraining/kohya_ss/tokenizer_cache"

# === 训练数据 ===
train_data_dir = "C:/LoraTraining/geometric/datasets/fangsheng_continuous/fangsheng_train_v2"
caption_extension = ".txt"
shuffle_caption = true
max_token_length = 75
clip_skip = 1
keep_tokens = 1
caption_dropout_rate = 0.05

# === 输出设置 ===
output_dir = "C:/LoraTraining/geometric/output/fangsheng_v2"
output_name = "ICH_fangsheng_pattern_lora_v2"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_epochs = 1
save_every_n_steps = 100
save_state = true
mixed_precision = "bf16"
gradient_checkpointing = false
sdpa = true
max_data_loader_n_workers = 2
device = "cuda"

# === 批次与分辨率 ===
train_batch_size = 1
gradient_accumulation_steps = 1
resolution = "512,512"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 1024
bucket_reso_steps = 64

# === 训练步数 ===
max_train_epochs = 12
max_train_steps = 0

# === LoRA 网络配置 ===
network_module = "networks.lora"
network_dim = 16
network_alpha = 8
network_dropout = 0.1

# === 优化器配置 ===
learning_rate = 2.5e-5
text_encoder_lr = 2.5e-5
unet_lr = 2.5e-5
lr_scheduler = "cosine"
lr_scheduler_num_cycles = 1
lr_decay_steps = 0.5

optimizer_type = "AdamW"
optimizer_args = ["weight_decay=0.01", "betas=0.9,0.95"]

# === 数据增强 ===
color_aug = false
flip_aug = false

# === 噪声配置 ===
loss_type = "l2"
noise_offset_type = "Original"

# === 缓存设置 ===
cache_latents = false
cache_latents_to_disk = false

# === 采样/日志 ===
sample_every_n_epochs = 1
sample_prompts = "C:/LoraTraining/geometric/configs/sample_prompts_fangsheng_v2.txt"
sample_frames = 1
sample_sampler = "euler_a"
sample_steps = 28

# === 调试/日志 ===
logging_dir = "C:/LoraTraining/geometric/output/fangsheng_v2/logs"
log_tracker_to_console = true

# === 其他 ===
seed = 42
v2 = false
v_pred = false

# === 元数据 ===
metadata_title = "ICH Fangsheng Pattern LoRA v2"
metadata_author = "LoRA Training"
metadata_description = "Chinese traditional fangsheng (overlapping lozenge) decorative pattern LoRA v2 - unified caption template emphasizing open-center border & regular interlocking diamond, 27 high-quality source images (11 open-center borders oversampled 2x), dim=16/alpha=8, bf16 GPU, trigger: ichpattern_fangsheng"
metadata_tags = "ichpattern_fangsheng,fangsheng pattern,chinese traditional pattern,geometric pattern,decorative motif,flat pattern design,overlapping lozenge,border frame,open center,seamless tile,traditional chinese pattern,ICH pattern"
metadata_trigger_phrase = "ichpattern_fangsheng"
