# 方胜纹 LoRA v4 训练配置
# v3 教训：连续类仅 8 张过少、结构描述缺失、串味
# v4：连续类补足至 22 张（新8 + v2 tile去重10 + v1 tile新增4），排除模糊/空白图
#      单独类 26 张全保留；caption 增加 two overlapping diamonds interlocking, geometric diamond cross 结构描述
#      统一结尾 regular structured lines；疏密 40/50/10；配色按图自动分析
# 数据：
#   2_fangsheng_single/      单独 26 源图, repeats=2   (52 步/epoch)
#   4_fangsheng_continuous/  连续 22 源图, repeats=4   (88 步/epoch)
# 步数：140步/epoch × 8 epoch = 1120 步
# 触发词：ichpattern_fangsheng_single / ichpattern_fangsheng_continuous

# === 基础模型 ===
pretrained_model_name_or_path = "C:/LoraTraining/stable-diffusion-webui/models/Stable-diffusion/v1-5-pruned-emaonly.safetensors"
tokenizer_cache_dir = "C:/LoraTraining/kohya_ss/tokenizer_cache"

# === 训练数据 ===
train_data_dir = "C:/LoraTraining/geometric/datasets/fangsheng_continuous/fangsheng_train_v4"
caption_extension = ".txt"
shuffle_caption = true
max_token_length = 75
clip_skip = 1
keep_tokens = 1
caption_dropout_rate = 0.05

# === 输出设置 ===
output_dir = "C:/LoraTraining/geometric/output/fangsheng_v4"
output_name = "ICH_fangsheng_pattern_lora_v4"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_epochs = 1
save_every_n_steps = 100
save_state = true
mixed_precision = "bf16"
gradient_checkpointing = false
sdpa = true
max_data_loader_n_workers = 2
device = "cuda"

# === 批次与分辨率 ===
train_batch_size = 1
gradient_accumulation_steps = 1
resolution = "512,512"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 1024
bucket_reso_steps = 64

# === 训练步数 ===
max_train_epochs = 8
max_train_steps = 0

# === LoRA 网络配置 ===
network_module = "networks.lora"
network_dim = 16
network_alpha = 8
network_dropout = 0.1

# === 优化器配置 ===
learning_rate = 1.5e-5
text_encoder_lr = 1.5e-5
unet_lr = 1.5e-5
lr_scheduler = "cosine"
lr_scheduler_num_cycles = 1

optimizer_type = "AdamW"
optimizer_args = ["weight_decay=0.01", "betas=0.9,0.95"]

# === 数据增强 ===
color_aug = false
flip_aug = true

# === 噪声配置 ===
loss_type = "l2"
noise_offset_type = "Original"

# === 缓存设置 ===
cache_latents = false
cache_latents_to_disk = false

# === 采样/日志 ===
sample_every_n_epochs = 1
sample_prompts = "C:/LoraTraining/geometric/configs/sample_prompts_fangsheng_v4.txt"
sample_frames = 1
sample_sampler = "euler_a"
sample_steps = 28

# === 调试/日志 ===
logging_dir = "C:/LoraTraining/geometric/output/fangsheng_v4/logs"
log_tracker_to_console = true

# === 其他 ===
seed = 42
v2 = false
v_pred = false

# === 元数据 ===
metadata_title = "ICH Fangsheng Pattern LoRA v4"
metadata_author = "LoRA Training"
metadata_description = "Chinese traditional fangsheng (two overlapping diamonds interlocking) pattern LoRA v4 - two classes: single centered medallion (26) + continuous seamless tile (22, expanded from 8), unified caption with structural description + 40/50/10 density split + per-image palette, dim=16/alpha=8, lr=1.5e-5, bf16+sdpa+flip, triggers: ichpattern_fangsheng_single / ichpattern_fangsheng_continuous"
metadata_tags = "ichpattern_fangsheng_single,ichpattern_fangsheng_continuous,fangsheng pattern,overlapping diamonds,interlocking diamond cross,chinese traditional pattern,geometric pattern,decorative motif,flat pattern design,seamless repeat,centered medallion,traditional chinese pattern,ICH pattern"
metadata_trigger_phrase = "ichpattern_fangsheng_single,ichpattern_fangsheng_continuous"
