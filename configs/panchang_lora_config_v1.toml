# 盘长纹 LoRA v1 训练配置
# 数据：66源图 -> 132张训练图
#   3_panchang_photo/      真实素材 20源图×flip=40张, repeats=3 (主力, 2048px高清, 训练占比57%)
#   1_panchang_schematic/  结构示意图 46源图×flip=92张, repeats=1 (补充)
# 步数：120 + 92 = 212步/epoch × 8 epoch = 1696步
# 触发词：ichpattern_panchang
# caption：统一模板（触发词→子类→平面→疏密→排布→对称→符号强度→配色→寓意）

# === 基础模型 ===
pretrained_model_name_or_path = "C:/LoraTraining/stable-diffusion-webui/models/Stable-diffusion/v1-5-pruned-emaonly.safetensors"
tokenizer_cache_dir = "C:/LoraTraining/kohya_ss/tokenizer_cache"

# === 训练数据 ===
train_data_dir = "C:/LoraTraining/geometric/datasets/panchang/panchang_train"
caption_extension = ".txt"
shuffle_caption = true
max_token_length = 75
clip_skip = 1
keep_tokens = 1
caption_dropout_rate = 0.05

# === 输出设置 ===
output_dir = "C:/LoraTraining/geometric/output/panchang_v1"
output_name = "ICH_panchang_pattern_lora_v1"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_epochs = 1
save_every_n_steps = 100
save_state = true
mixed_precision = "bf16"
gradient_checkpointing = false
sdpa = true
max_data_loader_n_workers = 2
device = "cuda"

# === 批次与分辨率 ===
train_batch_size = 1
gradient_accumulation_steps = 1
resolution = "512,512"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 1024
bucket_reso_steps = 64

# === 训练步数 ===
max_train_epochs = 8
max_train_steps = 0

# === LoRA 网络配置 ===
network_module = "networks.lora"
network_dim = 16
network_alpha = 8
network_dropout = 0.1

# === 优化器配置 ===
learning_rate = 2.5e-5
text_encoder_lr = 2.5e-5
unet_lr = 2.5e-5
lr_scheduler = "cosine"
lr_scheduler_num_cycles = 1
lr_decay_steps = 0.5

optimizer_type = "AdamW"
optimizer_args = ["weight_decay=0.01", "betas=0.9,0.95"]

# === 数据增强 ===
color_aug = false
flip_aug = false

# === 噪声配置 ===
loss_type = "l2"
noise_offset_type = "Original"

# === 缓存设置 ===
cache_latents = false
cache_latents_to_disk = false

# === 采样/日志 ===
sample_every_n_epochs = 1
sample_prompts = "C:/LoraTraining/geometric/configs/sample_prompts_panchang_v1.txt"
sample_frames = 1
sample_sampler = "euler_a"
sample_steps = 28

# === 调试/日志 ===
logging_dir = "C:/LoraTraining/geometric/output/panchang_v1/logs"
log_tracker_to_console = true

# === 其他 ===
seed = 42
v2 = false
v_pred = false

# === 元数据 ===
metadata_title = "ICH Panchang Pattern LoRA v1"
metadata_author = "LoRA Training"
metadata_description = "Chinese traditional panchang (endless knot) decorative pattern LoRA v1 - unified caption template (trigger/subtype/plane/density/layout/symmetry/symbol-strength/color/meaning), 20 high-res photo sources (repeats 3) + 46 schematic variants, dim=16/alpha=8, bf16 GPU, trigger: ichpattern_panchang"
metadata_tags = "ichpattern_panchang,panchang pattern,endless knot,chinese traditional pattern,geometric pattern,decorative motif,flat pattern design,lucky knot,auspicious symbol,ICH pattern"
metadata_trigger_phrase = "ichpattern_panchang"
