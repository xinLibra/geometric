# 锦地纹 LoRA v2 训练配置（按结构四分类）
# 数据：dataset/ 四子目录（N_ 前缀 = repeats=2）
#   2_jindi_huiwen   15张  ichpattern_jindi_huiwen
#   2_jindi_hex      13张  ichpattern_jindi_hex      (含6张 SD 生成补图)
#   2_jindi_diamond  15张  ichpattern_jindi_diamond  (含6张 SD 生成补图)
#   2_jindi_coin     15张  ichpattern_jindi_coin
# 步数：58源图 × repeats2 = 116图/epoch × 8 epoch = 928步
# caption：统一模板（触发词→子类→平面→疏密→排布→对称→符号强度→配色→寓意）

# === 基础模型 ===
pretrained_model_name_or_path = "C:/LoraTraining/stable-diffusion-webui/models/Stable-diffusion/v1-5-pruned-emaonly.safetensors"
tokenizer_cache_dir = "C:/LoraTraining/kohya_ss/tokenizer_cache"

# === 训练数据 ===
train_data_dir = "C:/LoraTraining/geometric/datasets/_raw/dataset"
caption_extension = ".txt"
shuffle_caption = true
max_token_length = 75
clip_skip = 1
keep_tokens = 1
caption_dropout_rate = 0.05

# === 输出设置 ===
output_dir = "C:/LoraTraining/geometric/output/jindi_v2"
output_name = "ICH_jindi_pattern_lora_v2"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_epochs = 1
save_every_n_steps = 100
save_state = true
mixed_precision = "bf16"
gradient_checkpointing = false
sdpa = true
max_data_loader_n_workers = 2
device = "cuda"

# === 批次与分辨率 ===
train_batch_size = 1
gradient_accumulation_steps = 1
resolution = "512,512"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 1024
bucket_reso_steps = 64

# === 训练步数 ===
max_train_epochs = 8
max_train_steps = 0

# === LoRA 网络配置 ===
network_module = "networks.lora"
network_dim = 16
network_alpha = 8
network_dropout = 0.1

# === 优化器配置 ===
learning_rate = 2.5e-5
text_encoder_lr = 2.5e-5
unet_lr = 2.5e-5
lr_scheduler = "cosine"
lr_scheduler_num_cycles = 1
lr_decay_steps = 0.5

optimizer_type = "AdamW"
optimizer_args = ["weight_decay=0.01", "betas=0.9,0.95"]

# === 数据增强 ===
color_aug = false
flip_aug = true

# === 噪声配置 ===
loss_type = "l2"
noise_offset_type = "Original"

# === 缓存设置 ===
cache_latents = false
cache_latents_to_disk = false

# === 采样/日志 ===
sample_every_n_epochs = 1
sample_prompts = "C:/LoraTraining/geometric/configs/sample_prompts_jindi_v2.txt"
sample_frames = 1
sample_sampler = "euler_a"
sample_steps = 28

# === 调试/日志 ===
logging_dir = "C:/LoraTraining/geometric/output/jindi_v2/logs"
log_tracker_to_console = true

# === 其他 ===
seed = 42
v2 = false
v_pred = false

# === 元数据 ===
metadata_title = "ICH Jindi (Brocade Ground) Pattern LoRA v2"
metadata_author = "LoRA Training"
metadata_description = "Chinese traditional jin-di (brocade ground) geometric pattern LoRA v2 - 4 structural subclasses (huiwen/hex/diamond/coin) with unified caption template (trigger/subtype/flat/density/layout/symmetry/symbol-strength/color/meaning), 58 sources x2 repeats, dim=16/alpha=8, bf16 GPU, 928 steps, triggers: ichpattern_jindi_huiwen, ichpattern_jindi_hex, ichpattern_jindi_diamond, ichpattern_jindi_coin"
metadata_tags = "ichpattern_jindi_huiwen,ichpattern_jindi_hex,ichpattern_jindi_diamond,ichpattern_jindi_coin,jin di pattern,huiwen,hex pattern,diamond pattern,coin pattern,chinese traditional pattern,geometric pattern,decorative motif,flat pattern design,seamless repeat,auspicious symbol,ICH pattern"
metadata_trigger_phrase = "ichpattern_jindi_huiwen, ichpattern_jindi_hex, ichpattern_jindi_diamond, ichpattern_jindi_coin"
