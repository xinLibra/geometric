# 方胜纹 · 单独 LoRA v2 训练配置（防连续、强居中）
# 目标: 只生成居中单独方胜徽章，不出现四方连续/满铺
# 数据: 25 张单独徽章（自动筛选: 居中/四周留白/非可平铺）x repeats3 = 75 步/epoch
#       fangsheng_single_train_v2/3_fangsheng_single
# 触发词: ichpattern_fangsheng_single
# 超参: dim=16/alpha=8, lr=1e-5 cosine, 8 epoch -> 600 步
# Caption v2: single motif only, isolated emblem, large empty margin, no repeat, no tiling, plain background
# 禁词: seamless, tileable, continuous, repeating pattern, full pattern, all-over
# 验收: 单个居中徽章、双菱交叠清楚、四周留白、换配色结构稳定；优先 E2~E5

# === 基础模型 ===
pretrained_model_name_or_path = "C:/LoraTraining/stable-diffusion-webui/models/Stable-diffusion/v1-5-pruned-emaonly.safetensors"
tokenizer_cache_dir = "C:/LoraTraining/kohya_ss/tokenizer_cache"

# === 训练数据 ===
train_data_dir = "C:/LoraTraining/geometric/datasets/fangsheng_single/fangsheng_single_train_v2"
caption_extension = ".txt"
shuffle_caption = true
max_token_length = 75
clip_skip = 1
keep_tokens = 1
caption_dropout_rate = 0.05

# === 输出设置 ===
output_dir = "C:/LoraTraining/geometric/output/fangsheng_single_v2"
output_name = "ICH_fangsheng_single_lora_v2"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_epochs = 1
save_every_n_steps = 100
save_state = true
mixed_precision = "bf16"
gradient_checkpointing = false
sdpa = true
max_data_loader_n_workers = 2
device = "cuda"

# === 批次与分辨率 ===
train_batch_size = 1
gradient_accumulation_steps = 1
resolution = "512,512"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 1024
bucket_reso_steps = 64

# === 训练步数 ===
max_train_epochs = 8
max_train_steps = 0

# === LoRA 网络配置 (v2: dim16/alpha8, 比 v1 更强拟合结构) ===
network_module = "networks.lora"
network_dim = 16
network_alpha = 8
network_dropout = 0.1

# === 优化器配置 ===
learning_rate = 1e-5
text_encoder_lr = 1e-5
unet_lr = 1e-5
lr_scheduler = "cosine"
lr_scheduler_num_cycles = 1

optimizer_type = "AdamW"
optimizer_args = ["weight_decay=0.01", "betas=0.9,0.95"]

# === 数据增强 ===
color_aug = false
flip_aug = true

# === 噪声配置 ===
loss_type = "l2"
noise_offset_type = "Original"

# === 缓存设置 ===
cache_latents = false
cache_latents_to_disk = false

# === 采样/日志 ===
sample_every_n_epochs = 1
sample_prompts = "C:/LoraTraining/geometric/configs/sample_prompts_fangsheng_single_v2.txt"
sample_frames = 1
sample_sampler = "euler_a"
sample_steps = 28

# === 调试/日志 ===
logging_dir = "C:/LoraTraining/geometric/output/fangsheng_single_v2/logs"
log_tracker_to_console = true

# === 其他 ===
seed = 42
v2 = false
v_pred = false

# === 元数据 ===
metadata_title = "ICH Fangsheng Single Pattern LoRA v2"
metadata_author = "LoRA Training"
metadata_description = "Chinese traditional fangsheng single pattern LoRA v2 - anti-continuous, strongly centered. 25 filtered single medallion images (centered, large margin, no tiling), dim=16/alpha=8, lr=1e-5 cosine, 8 epochs x 75 steps = 600 steps, bf16+sdpa+flip, trigger: ichpattern_fangsheng_single"
metadata_tags = "ichpattern_fangsheng_single,fangsheng single,overlapping diamonds,nested diamond lattice,interlocking diamond cross,single motif only,centered medallion,isolated emblem,large empty margin,no repeat,no tiling,chinese traditional pattern,geometric pattern,ICH pattern"
metadata_trigger_phrase = "ichpattern_fangsheng_single"
