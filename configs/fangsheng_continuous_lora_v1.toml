# 方胜纹 · 连续 LoRA v1 训练配置
# 独立 LoRA（与单独分开训，避免抢特征）
# 数据: 方胜纹新/连续纹样 20-37 共 18 张（20-27,34-37 纯菱格 + 28-33 团花）
#       fangsheng_continuous_train_v1/4_fangsheng_continuous  (repeats=4 -> 72 步/epoch)
# 触发词: ichpattern_fangsheng_continuous
# 超参: dim=8/alpha=4, lr=1e-5 cosine, 8 epoch -> 576 步
# Caption v1: two overlapping diamonds interlocking, nested diamond lattice, geometric diamond cross
# 验收: 嵌套/交叠菱格清晰、可平铺、不乱成网；风格接近 20、21、35、37；优先 E2~E5

# === 基础模型 ===
pretrained_model_name_or_path = "C:/LoraTraining/stable-diffusion-webui/models/Stable-diffusion/v1-5-pruned-emaonly.safetensors"
tokenizer_cache_dir = "C:/LoraTraining/kohya_ss/tokenizer_cache"

# === 训练数据 ===
train_data_dir = "C:/LoraTraining/geometric/datasets/fangsheng_continuous/fangsheng_continuous_train_v1"
caption_extension = ".txt"
shuffle_caption = true
max_token_length = 75
clip_skip = 1
keep_tokens = 1
caption_dropout_rate = 0.05

# === 输出设置 ===
output_dir = "C:/LoraTraining/geometric/output/fangsheng_continuous_v1"
output_name = "ICH_fangsheng_continuous_lora_v1"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_epochs = 1
save_every_n_steps = 100
save_state = true
mixed_precision = "bf16"
gradient_checkpointing = false
sdpa = true
max_data_loader_n_workers = 2
device = "cuda"

# === 批次与分辨率 ===
train_batch_size = 1
gradient_accumulation_steps = 1
resolution = "512,512"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 1024
bucket_reso_steps = 64

# === 训练步数 ===
max_train_epochs = 8
max_train_steps = 0

# === LoRA 网络配置 ===
network_module = "networks.lora"
network_dim = 8
network_alpha = 4
network_dropout = 0.1

# === 优化器配置 ===
learning_rate = 1e-5
text_encoder_lr = 1e-5
unet_lr = 1e-5
lr_scheduler = "cosine"
lr_scheduler_num_cycles = 1

optimizer_type = "AdamW"
optimizer_args = ["weight_decay=0.01", "betas=0.9,0.95"]

# === 数据增强 ===
color_aug = false
flip_aug = true

# === 噪声配置 ===
loss_type = "l2"
noise_offset_type = "Original"

# === 缓存设置 ===
cache_latents = false
cache_latents_to_disk = false

# === 采样/日志 ===
sample_every_n_epochs = 1
sample_prompts = "C:/LoraTraining/geometric/configs/sample_prompts_fangsheng_continuous_v1.txt"
sample_frames = 1
sample_sampler = "euler_a"
sample_steps = 28

# === 调试/日志 ===
logging_dir = "C:/LoraTraining/geometric/output/fangsheng_continuous_v1/logs"
log_tracker_to_console = true

# === 其他 ===
seed = 42
v2 = false
v_pred = false

# === 元数据 ===
metadata_title = "ICH Fangsheng Continuous Pattern LoRA v1"
metadata_author = "LoRA Training"
metadata_description = "Chinese traditional fangsheng continuous pattern LoRA v1 - standalone continuous LoRA, 18 source images (nested overlapping diamond lattice, seamless tile), dim=8/alpha=4, lr=1e-5 cosine, 8 epochs x 72 steps = 576 steps, bf16+sdpa+flip, trigger: ichpattern_fangsheng_continuous"
metadata_tags = "ichpattern_fangsheng_continuous,fangsheng continuous,overlapping diamonds,nested diamond lattice,interlocking diamond cross,chinese traditional pattern,geometric pattern,seamless repeat,tileable,decorative motif,ICH pattern"
metadata_trigger_phrase = "ichpattern_fangsheng_continuous"
